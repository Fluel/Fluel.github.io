<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluel — Portfolio</title>
<meta name="description" content="Portfolio Fluel: progetti di AI, machine learning e software, descritti senza dati riservati dei clienti.">
<meta property="og:image" content="banner.png">
<link rel="icon" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --blu: #4500ED;        /* Blu Fluel: every block */
  --blu-2: #5A1FF2;      /* slightly lighter block, for rhythm */
  --orange: #FF8600;     /* accent only */
  --lavender: #CFC8FF;   /* secondary text on blu */
  --ink: #352F44;        /* the only dark: text */
  --muted: #6A6480;
  --paper: #F5F3FA;
  --line: #DDD8EE;
  --rail: #CFC6F7;
  --display: "Rajdhani", sans-serif;
  --body: "Inter", system-ui, sans-serif;
  --wrap: 1180px;
  --gap: 20px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--paper); }
body { margin: 0; font: 400 1rem/1.65 var(--body); color: var(--ink); background: var(--paper); }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; border-radius: 4px; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 24px; }
.sym { width: 1em; height: 1em; flex: none; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: .5em; font: 600 1.05rem/1 var(--display); letter-spacing: .03em; text-decoration: none; padding: 13px 24px 12px; border-radius: 999px; border: 1.5px solid currentColor; transition: background .15s, color .15s, border-color .15s; }
.btn.solid { background: #fff; color: var(--blu); border-color: #fff; }
.btn.solid:hover { background: var(--orange); border-color: var(--orange); color: var(--ink); }
.btn.ghost { color: #fff; }
.btn.ghost:hover { background: #fff; color: var(--blu); }

/* Hero */
.hero { position: relative; overflow: hidden; background: var(--blu); color: #fff; }
.hero .shapes { position: absolute; inset: 0; pointer-events: none; }
.hero .shapes svg { position: absolute; }
.hero .s1 { width: min(58vw, 640px); height: min(58vw, 640px); right: -6%; top: -18%; }
.hero .s2 { width: min(34vw, 380px); height: min(34vw, 380px); right: 22%; bottom: -22%; }
.hero .s3 { width: min(14vw, 150px); height: min(14vw, 150px); right: 3%; bottom: -5%; }
nav.top { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 26px 0; }
nav.top img { height: 40px; width: auto; display: block; }
nav.top ul { display: flex; align-items: center; gap: 26px; list-style: none; margin: 0; padding: 0; font: 500 1.1rem var(--display); letter-spacing: .02em; }
nav.top ul a { text-decoration: none; }
nav.top ul a:hover { text-decoration: underline; text-underline-offset: 5px; }
.lang { display: inline-flex; border: 1.5px solid rgba(255,255,255,.6); border-radius: 999px; overflow: hidden; }
.lang button { font: 600 .9rem var(--display); background: none; color: #fff; border: 0; padding: 5px 12px 4px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: #fff; color: var(--blu); }
.hero-body { position: relative; padding: 72px 0 112px; max-width: 640px; }
.hero h1 { font: 600 clamp(3.6rem, 10vw, 7.2rem)/.88 var(--display); margin: 0 0 28px; }
.hero h1 span { display: block; font-size: .3em; font-weight: 500; letter-spacing: .03em; margin-top: 16px; color: var(--lavender); }
.hero p { font-size: 1.15rem; max-width: 46ch; margin: 0 0 34px; }
.hero .actions { display: flex; flex-wrap: wrap; gap: 12px; }

/* Section heads share the 3-column grid of the content below */
section.block { padding-top: 96px; }
.head { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: var(--gap); row-gap: 16px; align-items: end; margin-bottom: 36px; }
.head h2 { grid-column: 1 / 3; display: flex; align-items: center; gap: .35em; font: 600 clamp(2.2rem, 5vw, 3.1rem)/1 var(--display); margin: 0; }
.head h2 .sym { width: .66em; height: .66em; }
.head > p { grid-column: 3; margin: 0; color: var(--muted); }

/* Capabilities */
.caps { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); list-style: none; margin: 0; padding: 0; }
.cap { display: grid; grid-row: span 4; grid-template-rows: subgrid; row-gap: 0; padding: 28px; background: #fff; border: 1px solid var(--line); border-radius: 18px; }
.cap > svg { width: 52px; height: 52px; margin-bottom: 26px; }
.cap h3 { font: 600 1.55rem/1.05 var(--display); margin: 0 0 10px; }
.cap p { margin: 0 0 22px; color: var(--muted); font-size: .95rem; }
.cap ul { list-style: none; margin: 0; padding: 16px 0 0; border-top: 1px solid var(--line); display: grid; gap: 8px; align-content: start; }
.cap ul a { position: relative; display: block; padding-left: 14px; font-size: .92rem; font-weight: 500; color: var(--blu); text-decoration: none; }
.cap ul a::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: linear-gradient(var(--blu), var(--orange)); }
.cap ul a:hover { text-decoration: underline; text-underline-offset: 3px; }

/* Featured: indigo blocks, gradient only on the symbol */
.featured { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
.feat { position: relative; overflow: hidden; display: flex; flex-direction: column; min-height: 320px; padding: 128px 28px 28px; border-radius: 18px; background: var(--blu); color: #fff; text-decoration: none; isolation: isolate; transition: transform .2s; }
.feat:nth-child(even) { background: var(--blu-2); }
.feat:hover { transform: translateY(-4px); }
.feat > svg { position: absolute; z-index: -1; width: 170px; height: 170px; right: -42px; top: -42px; transition: transform .3s; }
.feat:hover > svg { transform: rotate(-8deg) scale(1.06); }
.feat .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; font: 500 1rem var(--display); letter-spacing: .02em; color: var(--lavender); }
.feat h3 { font: 600 1.7rem/1.04 var(--display); margin: 6px 0 12px; }
.feat p { margin: 0; font-size: .93rem; color: rgba(255,255,255,.9); }

/* Timeline overview: one column per year, one symbol per project */
.overview { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; align-items: stretch; gap: 0; padding: 56px 28px 0; background: #fff; border: 1px solid var(--line); border-radius: 18px; margin-bottom: 20px; }
.overview .col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 8px; padding: 14px 4px 0; }
.overview .stack { display: flex; flex-direction: column-reverse; align-items: center; gap: 6px; min-height: 24px; }
.overview .stack a { display: block; width: 26px; height: 26px; border-radius: 8px; transition: transform .15s; }
.overview .stack a:hover, .overview .stack a:focus-visible { transform: scale(1.25); }
.overview .stack svg { width: 100%; height: 100%; display: block; }
.overview .stack a.dim { opacity: .18; }
.overview .year { width: calc(100% - 8px); text-align: center; font: 500 1.05rem var(--display); color: var(--muted); padding: 10px 0 14px; border-top: 2px solid var(--rail); }
.overview .col.has .year { color: var(--blu); border-top-color: var(--blu); }
.tip { position: fixed; z-index: 10; pointer-events: none; max-width: 260px; font-size: .85rem; line-height: 1.35; background: var(--blu); color: #fff; padding: 8px 12px; border-radius: 10px; opacity: 0; transition: opacity .12s; }
.tip.on { opacity: 1; }
.tip b { display: block; font: 500 .85rem var(--display); color: var(--lavender); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
.filters button { display: inline-flex; align-items: center; gap: .45em; font: 600 1rem/1 var(--display); letter-spacing: .02em; background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px 8px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--blu); color: #fff; border-color: var(--blu); }
.count { font: 500 1rem var(--display); color: var(--muted); margin: 10px 0 0; }

/* Vertical timeline: a rail, year stops and alternating project cards */
.tl { position: relative; list-style: none; margin: 32px 0 0; padding: 0; }
.tl::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: var(--rail); }
.tl .stop { position: relative; display: flex; justify-content: center; margin: 40px 0 24px; }
.tl .stop:first-child { margin-top: 0; }
.tl .stop span { font: 600 1.35rem/1 var(--display); letter-spacing: .03em; color: #fff; background: var(--blu); padding: 9px 20px 8px; border-radius: 999px; }
.tl .item { position: relative; display: grid; grid-template-columns: 1fr 64px 1fr; align-items: start; margin-bottom: 20px; scroll-margin-top: 24px; }
.tl .node { grid-column: 2; justify-self: center; width: 40px; height: 40px; margin-top: 22px; padding: 8px; background: #fff; border: 2px solid var(--rail); border-radius: 50%; z-index: 1; }
.tl .node svg { width: 100%; height: 100%; display: block; }
.tl .card { grid-row: 1; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; position: relative; }
.tl .item:nth-child(odd of .item) .card { grid-column: 1; }
.tl .item:nth-child(even of .item) .card { grid-column: 3; }
.tl .card::after { content: ""; position: absolute; top: 40px; width: 20px; height: 2px; background: var(--rail); }
.tl .item:nth-child(odd of .item) .card::after { right: -21px; }
.tl .item:nth-child(even of .item) .card::after { left: -21px; }
.tl .item:target .card { border-color: var(--blu); box-shadow: 0 0 0 3px rgba(69,0,237,.12); }
.tl .kind { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; font: 500 .95rem var(--display); letter-spacing: .02em; color: var(--blu); margin: 0 0 4px; }
.tl .kind .chip, .feat .meta .chip { margin-left: 0; vertical-align: 0; }
.tl h3 { font: 600 1.4rem/1.1 var(--display); margin: 0 0 8px; }
.tl p { margin: 0 0 10px; font-size: .95rem; }
.tl .tech { font-size: .85rem; color: var(--muted); margin: 0; }
.tl .card a { font-weight: 500; color: var(--blu); font-size: .92rem; }

.techstack { display: block; max-width: 100%; }

/* "personal project" chip: an outline accent, never a filled block */
.chip { display: inline-block; vertical-align: .2em; margin-left: .5em; font: 500 .78rem/1 var(--display); letter-spacing: .04em; white-space: nowrap; color: var(--orange); border: 1px solid var(--orange); border-radius: 999px; padding: 4px 9px 3px; }
.feat .chip { color: #fff; border-color: rgba(255,255,255,.7); }
.cap ul .chip { vertical-align: .1em; margin-left: .4em; font-size: .72rem; padding: 3px 7px 2px; }
.overview .col.personal { position: relative; background: rgba(255,134,0,.07); }
.overview .col.personal.first { border-top-left-radius: 12px; }
.overview .col.personal.last { border-top-right-radius: 12px; }
.overview .band { position: absolute; left: 0; top: -12px; transform: translateY(-100%); display: flex; align-items: center; gap: 8px; font: 500 .9rem var(--display); letter-spacing: .03em; color: var(--orange); white-space: nowrap; }
.overview .band::after { content: ""; flex: 1; height: 1px; background: var(--orange); opacity: .5; }
.hero .note { display: inline-flex; align-items: center; gap: 10px; font-size: .95rem; color: var(--lavender); margin: -14px 0 30px; }
.hero .note .chip { margin: 0; color: #fff; border-color: rgba(255,255,255,.7); }

/* Contact: indigo block */
.contact { position: relative; overflow: hidden; margin-top: 110px; background: var(--blu); color: #fff; padding: 96px 0; }
.contact > svg { position: absolute; width: 380px; height: 380px; right: -90px; top: -90px; }
.contact h2 { font: 600 clamp(2.6rem, 6vw, 4rem)/1 var(--display); margin: 0 0 16px; position: relative; }
.contact p { max-width: 48ch; font-size: 1.1rem; margin: 0 0 30px; position: relative; }
.contact .actions { display: flex; flex-wrap: wrap; gap: 12px; position: relative; }
.contact .btn.solid { background: var(--orange); border-color: var(--orange); color: var(--ink); }
.contact .btn.solid:hover { background: #fff; border-color: #fff; }
.contact .fine { margin: 56px 0 0; font-size: .85rem; color: var(--lavender); max-width: 70ch; }

@media (max-width: 960px) {
  .caps, .featured { grid-template-columns: 1fr 1fr; }
  .head { grid-template-columns: 1fr; }
  .head h2, .head > p { grid-column: 1; }
  .tl::before { left: 20px; }
  .tl .stop { justify-content: flex-start; }
  .tl .item { grid-template-columns: 40px 1fr; column-gap: 16px; }
  .tl .node { grid-column: 1; }
  .tl .item:nth-child(n of .item) .card { grid-column: 2; }
  .tl .item:nth-child(n of .item) .card::after { left: -17px; right: auto; width: 16px; }
  .overview { padding: 48px 12px 0; }
  .overview .stack a { width: 20px; height: 20px; }
}
@media (max-width: 640px) {
  nav.top ul li:not(.keep) { display: none; }
  .hero-body { padding: 40px 0 150px; }
  .hero .s1 { width: 250px; height: 250px; right: -100px; top: auto; bottom: -100px; }
  .hero .s2 { width: 150px; height: 150px; right: 140px; bottom: -85px; }
  .hero .s3 { display: none; }
  .caps, .featured { grid-template-columns: 1fr; }
  section.block { padding-top: 72px; }
  .overview .year { font-size: .8rem; }
  .overview .stack a { width: 16px; height: 16px; border-radius: 4px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .feat, .feat > svg, .overview .stack a { transition: none; }
  .feat:hover, .feat:hover > svg { transform: none; }
}
</style>
</head>

    navSkills: "expertise", navWork: "projects", navContact: "contact",
    heroSub: "artificial intelligence since 2016",
    lede: "AI, machine learning and software projects built for companies and professionals, alongside our own products and in-house research. The code is private; here you'll find the context, the solution and the technology.",
    cta: "Explore the work",
    chip: "personal project",
    personalNote: "Since 2024 this is a personal portfolio: projects marked this way are not business work.",
    personalBand: "personal projects",
    personalFilter: "personal",
    chipShort: "personal",
    skillsTitle: "expertise",
    skillsText: "From research to production services, with the web and mobile apps that put AI to work.",
    featTitle: "featured", featText: "Our most representative products and projects.",
    workTitle: "project timeline", workText: "Each symbol is a project: hover for the title, click to read the entry.",
    stackTitle: "tech stack",
    all: "All",
    kinds: { client: "client work", product: "Fluel products", rnd: "research", training: "training" },
    kindOne: { client: "client project", product: "Fluel product", rnd: "research and development", training: "training" },
    kindPersonal: { product: "product" },
    count: n => `${n} projects`,
    open: "Open the material",
    contactTitle: "let's talk",
    contactText: "To discuss a project in more depth or explore a collaboration, reach me on LinkedIn.",
    linkedin: "LinkedIn profile",
    nda: "Client names, data and confidential details are omitted or generalised to honour non-disclosure agreements."
  }
};
const CAPS = [
  { sym: "innovazione", ids: ["regula", "knai", "heritage-rag"],
    it: ["llm, rag e agenti", "Assistenti che rispondono citando le fonti, agenti che eseguono procedure, sistemi multi-agente."],
    en: ["llm, rag and agents", "Assistants that answer with cited sources, agents that run procedures, multi-agent systems."] },
  { sym: "codice", ids: ["ai-legal", "las", "bank-rag"],
    it: ["linguaggio naturale", "Lettura di documenti, riconoscimento di entità e classificazione di testi in italiano."],
    en: ["natural language", "Document reading, entity recognition and Italian text classification."] },
  { sym: "consistenza", ids: ["easy-queue", "shelf-vision", "manuscripts"],
    it: ["visione artificiale", "Riconoscimento di prodotti, documenti e caratteri, anche su dispositivi edge."],
    en: ["computer vision", "Recognising products, documents and characters, on edge devices too."] },
  { sym: "aiuto", ids: ["obsolescence", "air-quality", "materials"],
    it: ["analisi predittiva", "Previsioni su serie storiche, sensori IoT, magazzino e processi produttivi."],
    en: ["predictive analytics", "Forecasting for time series, IoT sensors, inventory and production."] },
  { sym: "persone", ids: ["voicebot", "voice-dating", "short-video"],
    it: ["voce e audio", "Voicebot, sintesi e riconoscimento vocale, contenuti audio e video generati."],
    en: ["voice and audio", "Voicebots, speech synthesis and recognition, generated audio and video."] },
  { sym: "pittogramma", ids: ["boostme", "fitness-recomp", "creative-cards"],
    it: ["prodotti web e mobile", "Le applicazioni che portano l'AI agli utenti: dal backend su cloud all'app sullo store."],
    en: ["web and mobile products", "The apps that bring AI to users: from cloud backend to the app in the store."] },
];
const SYM = { client: "persone", product: "innovazione", rnd: "consistenza", training: "aiuto" };
const icon = (name, soft) => `<svg viewBox="0 0 100 100" aria-hidden="true"${soft ? ' style="--g:url(#fg-soft)"' : ""}><use href="#s-${name}"/></svg>`;
const chip = (short) => { const c = document.createElement("span"); c.className = "chip"; c.textContent = short ? T[lang].chipShort : T[lang].chip; return c; };
const kindLabel = p => (p.personal && T[lang].kindPersonal[p.kind]) || T[lang].kindOne[p.kind];
const matches = p => filter === "all" || (filter === "personal" ? p.personal : p.kind === filter);
const firstSentence = s => s.split(/(?<=\.)\s/)[0];
const $ = s => document.querySelector(s);
let projects = [], lang = "it", filter = "all";
try { lang = localStorage.getItem("lang") || ""; } catch {}
lang = new URLSearchParams(location.search).get("lang") || lang || (navigator.language.startsWith("it") ? "it" : "en");
if (!T[lang]) lang = "en";

function drawCaps() {
  const byId = Object.fromEntries(projects.map(p => [p.id, p]));
  $("#caps").replaceChildren(...CAPS.map(c => {
    const li = document.createElement("li"); li.className = "cap";
    li.innerHTML = `${icon(c.sym)}<h3></h3><p></p><ul></ul>`;
    li.querySelector("h3").textContent = c[lang][0];
    li.querySelector("p").textContent = c[lang][1];
    li.querySelector("ul").append(...c.ids.filter(id => byId[id]).map(id => {
      const item = document.createElement("li"), a = document.createElement("a");
      a.href = `#p-${id}`; a.textContent = byId[id].title[lang].split(":")[0];
      if (byId[id].personal) a.append(chip(true));
      item.append(a); return item;
    }));
    return li;
  }));
}

function drawFeatured() {
  const t = T[lang];
  $("#featuredList").replaceChildren(...projects.filter(p => p.featured).sort((a, b) => a.featured - b.featured).map(p => {
    const a = document.createElement("a"); a.className = "feat"; a.href = `#p-${p.id}`;
    a.innerHTML = `${icon(SYM[p.kind], true)}<div class="meta"><span></span><span></span></div><h3></h3><p></p>`;
    const [y, k] = a.querySelectorAll(".meta span");
    y.textContent = p.year; k.textContent = kindLabel(p);
    a.querySelector("h3").textContent = p.title[lang].split(":")[0];
    if (p.personal) a.querySelector(".meta").append(chip());
    a.querySelector("p").textContent = firstSentence(p.summary[lang]);
    return a;
  }));
}

function drawOverview() {
  const t = T[lang], tip = $("#tip");
  const years = projects.map(p => p.year);
  const cols = [];
  for (let y = Math.min(...years); y <= Math.max(...years); y++) {
    const col = document.createElement("div"), stack = document.createElement("div"), label = document.createElement("div");
    const here = projects.filter(p => p.year === y);
    const personal = here.some(p => p.personal);
    col.className = "col" + (here.length ? " has" : "") + (personal ? " personal" : ""); stack.className = "stack"; label.className = "year"; label.textContent = y;
    stack.append(...here.map(p => {
      const a = document.createElement("a"); a.href = `#p-${p.id}`; a.tabIndex = -1;
      a.innerHTML = icon(SYM[p.kind]);
      if (!matches(p)) a.classList.add("dim");
      a.onmouseenter = e => { tip.innerHTML = `<b></b>`; tip.firstChild.textContent = `${p.year} / ${kindLabel(p)}${p.personal ? ` / ${t.chip}` : ""}`; tip.append(p.title[lang]); tip.classList.add("on"); };
      a.onmousemove = e => { tip.style.left = Math.min(e.clientX + 14, innerWidth - 280) + "px"; tip.style.top = e.clientY + 16 + "px"; };
      a.onmouseleave = () => tip.classList.remove("on");
      return a;
    }));
    col.append(stack, label); cols.push(col);
  }
  const band = cols.filter(c => c.classList.contains("personal"));
  if (band.length) {
    band[0].classList.add("first"); band.at(-1).classList.add("last");
    const label = document.createElement("div"); label.className = "band"; label.textContent = t.personalBand;
    label.style.width = `${band.length * 100}%`;
    band[0].append(label);
  }
  $("#overview").replaceChildren(...cols);
}

function drawTimeline() {
  const t = T[lang];
  const f = $("#filters"); f.setAttribute("aria-label", t.workTitle);
  f.replaceChildren(...["all", ...Object.keys(t.kinds), "personal"].map(k => {
    const b = document.createElement("button");
    b.type = "button"; b.innerHTML = SYM[k] ? icon(SYM[k]).replace("<svg", '<svg class="sym"') : "";
    b.append(k === "all" ? t.all : k === "personal" ? t.personalFilter : t.kinds[k]);
    b.setAttribute("aria-pressed", filter === k);
    b.onclick = () => { filter = k; drawOverview(); drawTimeline(); };
    return b;
  }));
  const shown = projects.filter(matches);
  $("#count").textContent = t.count(shown.length);
  const out = []; let year;
  for (const p of shown) {
    if (p.year !== year) {
      year = p.year;
      const stop = document.createElement("li"); stop.className = "stop"; stop.innerHTML = "<span></span>";
      stop.firstChild.textContent = year; out.push(stop);
    }
    const li = document.createElement("li"); li.className = "item"; li.id = `p-${p.id}`;
    li.innerHTML = `<div class="node">${icon(SYM[p.kind])}</div><article class="card"><p class="kind"></p><h3></h3><p class="sum"></p><p class="tech"></p></article>`;
    li.querySelector(".kind").textContent = `${p.year} / ${kindLabel(p)}`;
    li.querySelector("h3").textContent = p.title[lang];
    if (p.personal) li.querySelector(".kind").append(chip());
    li.querySelector(".sum").textContent = p.summary[lang];
    li.querySelector(".tech").textContent = p.stack.join(" · ");
    if (p.link) { const a = document.createElement("a"); a.href = p.link; a.textContent = t.open; li.querySelector(".card").append(a); }
    out.push(li);
  }
  $("#timeline").replaceChildren(...out);
  stagger();
}

// Desktop: each card starts part-way down the previous one (other side of the rail)
// but never overlaps the last card on its own side. Mobile keeps the plain stack.
function stagger() {
  const nodes = [...$("#timeline").children];
  nodes.forEach(n => n.style.marginTop = ""); $("#timeline").style.paddingBottom = "";
  if (innerWidth <= 960) return;
  const top = n => n.getBoundingClientRect().top + scrollY;
  const bottom = n => n.getBoundingClientRect().bottom + scrollY;
  let prev = null, side = 0, sideBottom = [0, 0];
  for (const n of nodes) {
    if (n.classList.contains("stop")) {
      const lowest = Math.max(...sideBottom);
      if (prev) n.style.marginTop = `${Math.max(40, lowest - bottom(prev) + 40)}px`;
      prev = null; sideBottom = [0, 0];
      continue;
    }
    if (prev) {
      const natural = top(n);
      const want = Math.max(top(prev) + 96, sideBottom[side] + 24);
      n.style.marginTop = `${want - natural}px`;
    }
    sideBottom[side] = bottom(n.querySelector(".card"));
    prev = n; side = 1 - side;
  }
  const last = nodes.at(-1);
  if (last) $("#timeline").style.paddingBottom = `${Math.max(0, Math.max(...sideBottom) - bottom(last))}px`;
}
let resizeFrame;
addEventListener("resize", () => { cancelAnimationFrame(resizeFrame); resizeFrame = requestAnimationFrame(stagger); });
document.fonts?.ready.then(() => stagger());

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(n => n.textContent = T[lang][n.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  drawCaps(); drawFeatured(); drawOverview(); drawTimeline();
}

document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  lang = b.dataset.lang; try { localStorage.setItem("lang", lang); } catch {}
  render();
});

fetch("projects.json").then(r => r.json()).then(d => {
  projects = d.sort((a, b) => b.year - a.year);
  render();
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
});
</script>
</body>
</html>
